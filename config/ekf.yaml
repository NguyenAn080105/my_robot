frequency: 30.0
sensor_timeout: 0.1
two_d_mode: true
transform_time_offset: 0.0
transform_timeout: 0.0
print_diagnostics: true
debug: false
publish_tf: true

map_frame: map
odom_frame: odom
base_link_frame: base_footprint
world_frame: odom

# --- ODOMETRY TỪ BÁNH XE (Encoder) ---
odom0: /odom/wheel

# Lấy Vx (tốc độ tới) và Vyaw (tốc độ xoay)
odom0_config: [false, false, false,
               false, false, false,
               true,  false, false,   # Vx
               false, false, true,    # Vyaw
               false, false, false]

odom0_queue_size: 10
odom0_nodelay: true
odom0_differential: false
odom0_relative: false

# --- IMU ---
imu0: /imu

imu0_config: [false, false, false,
              false, false, true,     # Yaw (Góc hướng)
              false, false, false,
              false, false, true,     # Vyaw (Tốc độ xoay)
              false, false, false]    # ax (TẮT NGAY để hết trôi)

imu0_differential: false
imu0_relative: true           
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: true